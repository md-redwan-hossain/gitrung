name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --minify --outfile dist/gitrung-windows-x64.exe --target=bun-windows-x64
          bun build ./src/index.ts --compile --minify --outfile dist/gitrung-linux-x64 --target=bun-linux-x64
          bun build ./src/index.ts --compile --minify --outfile dist/gitrung-darwin-arm64 --target=bun-darwin-arm64
          bun build ./src/index.ts --compile --minify --outfile dist/gitrung-darwin-x64 --target=bun-darwin-x64

          cd dist
          for binary in gitrung-windows-x64.exe gitrung-linux-x64 gitrung-darwin-arm64 gitrung-darwin-x64; do
            stem="${binary%.exe}"
            sha256sum "$binary" > "${stem}.sha256"
            zip -j "${stem}.zip" "$binary"
            rm "$binary"
          done

      - name: Publish latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          files: dist/gitrung-*
          make_latest: true
          body: |
            Rolling build. Assets are replaced each time this workflow is run.
            Download the `.zip` for your platform, extract the binary, then run it.
